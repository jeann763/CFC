<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CourseForCleaning - Main Page</title>
	<style>
		/* Apply full-screen height and center content */
		body, html {
			height: 100%;
			margin: 0;
			display: flex;
			align-items: center; /* Vertically center */
			justify-content: center; /* Horizontally center */
			background-color: #f0f0f0; /* Optional: Set a light background color */
		}

		/* Create a grid layout with 3 columns */
		.container {
			display: grid;
			grid-template-columns: repeat(3, 1fr); /* 3 equal columns */
			grid-gap: 20px; /* Space between buttons */
			justify-items: center; /* Center the buttons within each column */
			text-align: center; /* Center text in buttons */
		}

		/* Style buttons for consistent appearance */
		button {
			font-size: 50px;
			padding: 20px 40px;
			border: none;
			border-radius: 5px;
			color: white;
			cursor: pointer;
			text-align: center;
			width: 250px; /* Standard width */
		}

		/* Customize button sizes and colors */
		#confirmButton1 {
			background-color: #4CAF50;
			width: 300px; /* Larger size */
			height: 100px;
		}
		#confirmButton2 {
			background-color: #2196F3;
			width: 330px;
			height: 90px;
		}
		#confirmButton3 {
			background-color: #f44336;
			width: 350px; /* Larger size */
			height: 120px;
		}
		#confirmButton4 {
			background-color: #ff9800;
			width: 280px;
			height: 110px;
		}
		#confirmButton5 {
			background-color: #9C27B0;
			width: 320px;
			height: 100px;
		}
		#confirmButton6 {
			background-color: #3f51b5;
			width: 400px;
			height: 90px;
		}
		#confirmButton7 {
			background-color: #009688;
			width: 300px;
			height: 80px;
		}
		#confirmButton8 {
			background-color: #FFD700;
			width: 280px;
			height: 80px;
		}
	</style>
</head>

<body>

	<div class="container">
		<!-- Buttons -->
		<button id="confirmButton1" onclick="confirmAction('Sub Pages/SUB PAGE boyle.html')">BOYLE</button>
		<button id="confirmButton2" onclick="confirmAction('Sub Pages/SUB PAGE chadwick.htm')">CHADWICK</button>
		<button id="confirmButton3" onclick="confirmAction('Sub Pages/SUB PAGE dalton.htm')">DALTON</button>
		<button id="confirmButton4" onclick="confirmAction('Sub Pages/SUB PAGE fischer.htm')">FISCHER</button>
		<button id="confirmButton5" onclick="confirmAction('Sub Pages/SUB PAGE franklin.htm')">FRANKLIN</button>
		<button id="confirmButton6" onclick="confirmAction('Sub Pages/SUB PAGE mendeleev.htm')">MENDELEEV</button>

	</div>

    <script>
        // Function to redirect to the given URL
        function confirmAction(url) {
            // If URL is provided, redirect to that location
            if (url) {
                window.location.href = url;
            }
            // Add more logic here if you want to handle other buttons in a custom way
        }
    </script>

</body>

</html>
