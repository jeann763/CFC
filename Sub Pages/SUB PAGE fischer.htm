<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>FISCHER</title>
	<style>
		/* Apply full-screen height and center content */
		body, html {
			height: 100%;
			margin: 0;
			display: flex;
			align-items: center; /* Vertically center */
			justify-content: center; /* Horizontally center */
			background-color: #f0f0f0; /* Optional: Set a light background color */
		}

		/* Create a grid layout with 3 columns */
		.container {
			display: grid;
			grid-template-columns: repeat(3, 1fr); /* 3 equal columns */
			grid-gap: 20px; /* Space between buttons */
			justify-items: center; /* Center the buttons within each column */
			text-align: center; /* Center text in buttons */
		}

		/* Style buttons for consistent appearance */
		button {
			font-size: 50px;
			padding: 20px 40px;
			border: none;
			border-radius: 5px;
			color: white;
			cursor: pointer;
			text-align: center;
			width: 250px; /* Standard width */
		}

		/* Customize button sizes and colors */
		#confirmButton1 {
			background-color: #4CAF50;
			width: 300px; /* Larger size */
			height: 100px;
		}
		#confirmButton2 {
			background-color: #2196F3;
			width: 300px;
			height: 100px;
		}
		#confirmButton3 {
			background-color: #f44336;
			width: 300px; /* Larger size */
			height: 100px;
		}
		#confirmButton4 {
			background-color: #ff9800;
			width: 300px;
			height: 100px;
		}
		#confirmButton5 {
			background-color: #9C27B0;
			width: 320px;
			height: 100px;
		}
		#confirmButton6 {
			background-color: #000000;
			width: 320px;
			height: 100px;
		}
	</style>
</head>

<body>

	<div class="container">
		<!-- Buttons -->
		<button id="confirmButton1" onclick="confirmAction('../Monitoring Pages/Fischer/MonitoringPageMonday.htm')">Monday</button>
		<button id="confirmButton2" onclick="confirmAction('../Monitoring Pages/Fischer/MonitoringPageTuesday.htm')">Tuesday</button>
		<button id="confirmButton3" onclick="confirmAction('../Monitoring Pages/Fischer/MonitoringPageWednesday.htm')">Wednesday</button>
		<button id="confirmButton4" onclick="confirmAction('../Monitoring Pages/Fischer/MonitoringPageThursday.htm')">Thursday</button>
		<button id="confirmButton5" onclick="confirmAction('../Monitoring Pages/Fischer/MonitoringPageFriday.htm')">Friday</button>
		<button id="confirmButton6" onclick="confirmAction('../index.html')" aria-label="Go back to the index page">Back</button>
	</div>

	<script>
		// The correct PIN
		const correctPin = "1004";

		// Function to confirm PIN and redirect
		function confirmAction(url) {
			// Ask for PIN before proceeding
			const pin = prompt("Please enter the 4-digit PIN:");

			if (pin === correctPin) {
				// If the PIN is correct, redirect to the URL
				window.location.href = url;
			} else {
				// If the PIN is incorrect, show an alert
				alert("Incorrect PIN, access not allowed.");
			}
		}
	</script>

</body>

</html>
