<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
        .editable {
            background-color: #f9f9f9;
            cursor: pointer; /* Makes it clear that these cells are editable */
        }
    </style>
    <title>Rankings</title>
</head>
<body>
<button onclick="window.location.href='../index.html'" aria-label="Go back to the index page">Back</button>
    <br>
    
    <h1>Rankings</h1>
    <h2>Please input the general average of each section per day.</h2>

    <table>
        <thead>
            <tr>
                <th>Section</th>
                <th>Monday</th>
                <th>Tuesday</th>
                <th>Wednesday</th>
                <th>Thursday</th>
                <th>Friday</th>
                <th>Average</th>
            </tr>
        </thead>
        <tbody>
            <tr id="Boyle">
                <td>Boyle</td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="result">0</td>
            </tr>
            <tr id="Chadwick">
                <td>Chadwick</td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="result">0</td>
            </tr>
            <tr id="Dalton">
                <td>Dalton</td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="result">0</td>
            </tr>
            <tr id="Fischer">
                <td>Fischer</td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="result">0</td>
            </tr>
            <tr id="Franklin">
                <td>Franklin</td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="result">0</td>
            </tr>
            <tr id="Mendeleev">
                <td>Mendeleev</td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="result">0</td>
            </tr>
            <tr id="Wohler">
                <td>Wohler</td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="editable" contenteditable="true"></td>
                <td class="result">0</td>
            </tr>
        </tbody>
    </table>

<script>
    // Load data from localStorage and populate the table
    function loadData() {
        const savedData = JSON.parse(localStorage.getItem('tableData'));
        if (savedData) {
            Object.keys(savedData).forEach(rowId => {
                const rowData = savedData[rowId];
                const row = document.getElementById(rowId);
                rowData.forEach((value, index) => {
                    const editableCell = row.querySelectorAll('.editable')[index];
                    if (editableCell) {
                        editableCell.textContent = value;
                    }
                });
                calculateAverage(row);  // Recalculate the average based on saved data
            });
            sortRows();  // Sort rows by average value on page load
        }
    }

    // Save data to localStorage
    function saveData() {
        const tableData = {};
        document.querySelectorAll('tbody tr').forEach(row => {
            const rowId = row.id;
            const editableCells = row.querySelectorAll('.editable');
            const rowValues = Array.from(editableCells).map(cell => parseFloat(cell.textContent) || 0);
            tableData[rowId] = rowValues;
        });
        localStorage.setItem('tableData', JSON.stringify(tableData));
    }

    // Function to calculate average of the row
    function calculateAverage(row) {
        const cells = row.querySelectorAll('td.editable'); // Select the editable cells
        let sum = 0;
        let count = 0;

        // Iterate through each cell and sum up the values
        cells.forEach(cell => {
            const value = parseFloat(cell.textContent);
            if (!isNaN(value)) {
                sum += value;
                count++;
            }
        });

        // Calculate and set the average in the 'Result' cell
        const resultCell = row.querySelector('.result');
        const average = count > 0 ? (sum / count).toFixed(2) : 0; // Prevent division by zero
        resultCell.textContent = average;
    }

    // Sort the rows in descending order based on the average values
    function sortRows() {
        const rows = Array.from(document.querySelectorAll('tbody tr'));
        rows.sort((rowA, rowB) => {
            const avgA = parseFloat(rowA.querySelector('.result').textContent);
            const avgB = parseFloat(rowB.querySelector('.result').textContent);
            return avgB - avgA; // Sort in descending order
        });

        // Re-append rows in sorted order
        const tbody = document.querySelector('tbody');
        rows.forEach(row => tbody.appendChild(row));
    }

    // Add event listeners to editable cells
    document.querySelectorAll('.editable').forEach(cell => {
        // Event listener for when the user clicks away from the cell (blur event)
        cell.addEventListener('blur', function() {
            const row = this.closest('tr');
            calculateAverage(row); // Recalculate the average when the cell loses focus
            saveData(); // Save data after input change
            sortRows(); // Sort the rows after the data change
        });

        // Event listener for when the user presses the Enter key
        cell.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                const row = this.closest('tr');
                calculateAverage(row); // Recalculate the average when Enter is pressed
                saveData(); // Save data after pressing Enter
                sortRows(); // Sort the rows after the data change
            }
        });
    });

    // Initial data load from localStorage
    window.onload = loadData;
</script>

</body>
</html>
