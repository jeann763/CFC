<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
        .editable {
            background-color: #f9f9f9;
            cursor: pointer; /* Makes it clear that these cells are editable */
        }
    </style>
    <title>Rankings</title>
</head>
<body>
<button onclick="window.location.href='../index.html'" aria-label="Go back to the index page">Back</button>
    <br>
    
    <h2>Rankings</h2>

    <table>
        <thead>
            <tr>
                <th>Section</th>
                <th>Monday</th>
                <th>Tuesday</th>
                <th>Wednesday</th>
                <th>Thursday</th>
                <th>Friday</th>
                <th>Average</th>
            </tr>
        </thead>
        <tbody>
            <tr id="Boyle">
                <td>Boyle</td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td id="Result">0</td>
            </tr>
            <tr id="Chadwick">
                <td>Chadwick</td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td id="Result">0</td>
            </tr>
            <tr id="Dalton">
                <td>Dalton</td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td id="Result">0</td>
            </tr>
            <tr id="Fischer">
                <td>Fischer</td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td id="Result">0</td>
            </tr>
            <tr id="Franklin">
                <td>Franklin</td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td id="Result">0</td>
            </tr>
            <tr id="Mendeleev">
                <td>Mendeleev</td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td id="Result">0</td>
            </tr>
            <tr id="Wohler">
                <td>Wohler</td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td class="editable"></td>
                <td id="Result">0</td>
            </tr>
        </tbody>
    </table>

<script>
    // Set a unique key for each page (e.g., based on the day or file)
    const pageKey = "rankingsPage"; // Change this to match the specific page

    // Save data when the user leaves the page
    window.addEventListener('beforeunload', saveData);

    function saveData() {
        const tableData = {};
        document.querySelectorAll('tbody tr').forEach(row => {
            const rowId = row.id;
            const editableCells = row.querySelectorAll('.editable');
            const rowValues = Array.from(editableCells).map(cell => parseFloat(cell.textContent) || 0);
            tableData[rowId] = rowValues;
        });
        localStorage.setItem(pageKey, JSON.stringify(tableData));
        console.log("Data saved:", tableData); // Log data being saved
    }

    function loadData() {
        const savedData = JSON.parse(localStorage.getItem(pageKey));
        if (savedData) {
            Object.keys(savedData).forEach(rowId => {
                const rowData = savedData[rowId];
                const row = document.getElementById(rowId);
                rowData.forEach((value, index) => {
                    const editableCell = row.querySelectorAll('.editable')[index];
                    if (editableCell) {
                        editableCell.textContent = value;
                    }
                });
                calculateAverage(row);  // Recalculate the average based on saved data
            });
        }
    }

    // Function to calculate the average of the row and update the "Result" cell
    function calculateAverage(row) {
        const cells = row.querySelectorAll('td.editable');
        let sum = 0;
        let count = 0;

        // Iterate through each cell and sum up the values
        cells.forEach(cell => {
            const value = parseFloat(cell.textContent);
            if (!isNaN(value)) {
                sum += value;
                count++;
            }
        });

        // Calculate and set the average in the 'Result' cell
        const resultCell = row.querySelector('#Result');
        const average = count > 0 ? (sum / count).toFixed(2) : 0; // Prevent division by zero
        resultCell.textContent = average;
    }

    // Add click event to make cells editable
    document.querySelectorAll('.editable').forEach(cell => {
        cell.addEventListener('click', function() {
            let currentText = cell.textContent.trim();
            let input = document.createElement('input');
            input.type = 'text';
            input.value = currentText;

            // Replace the cell content with an input box
            cell.textContent = '';
            cell.appendChild(input);

            // Focus the input field
            input.focus();

            // When input loses focus, save the new value and calculate average
            input.addEventListener('focusout', function() {
                let newValue = input.value.trim();
                cell.textContent = newValue || '';  // If blank, leave the cell empty
                const row = cell.closest('tr');
                calculateAverage(row);  // Recalculate the average
                saveData();  // Save data immediately after editing
            });

            // Trigger focusout on Enter key press
            input.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    input.blur(); // Trigger focusout manually on Enter key
                }
            });
        });
    });

    // Initial data load from localStorage on page load
    window.addEventListener('load', function() {
        loadData();
    });
</script>

    
</body>
</html>
