<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
    </style>
    <title>Fetch Specific Cells from 5 HTML Files</title>
</head>
<body>
    <h2>Data from 5 Different HTML Files</h2>

    <table>
        <thead>
            <tr>
                <th>Section</th>
                <th>Score 1</th>
                <th>Score 2</th>
                <th>Score 3</th>
                <th>Score 4</th>
                <th>Score 5</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Example Section</td>
                <td id="score1">Loading...</td>
                <td id="score2">Loading...</td>
                <td id="score3">Loading...</td>
                <td id="score4">Loading...</td>
                <td id="score5">Loading...</td>
            </tr>
        </tbody>
    </table>

    <script>
        // Function to fetch data from multiple HTML files and select specific cells
        function fetchDataFromOtherHTML() {
            // Array of URLs for the external HTML files
            const urls = [
                'Monitoring Pages/Boyle/MonitoringPageMonday.htm', // First external HTML file
                'Monitoring Pages/Boyle/MonitoringPageTuesday.htm', // Second external HTML file
                'Monitoring Pages/Boyle/MonitoringPageWednesday.htm', // Third external HTML file
                'Monitoring Pages/Boyle/MonitoringPageThursday.htm', // Fourth external HTML file
                'Monitoring Pages/Boyle/MonitoringPageFriday.htm'  // Fifth external HTML file
            ];

            // Array of cell selectors for the specific cells you want to fetch
            const selectors = [
                'table:nth-of-type(1) tr:nth-child(10) td:nth-child(10)', // Cell from table1.html
                'table:nth-of-type(1) tr:nth-child(10) td:nth-child(10)', // Cell from table2.html
                'table:nth-of-type(1) tr:nth-child(10) td:nth-child(10)', // Cell from table3.html
                'table:nth-of-type(1) tr:nth-child(10) td:nth-child(10)', // Cell from table4.html
                'table:nth-of-type(1) tr:nth-child(10) td:nth-child(10)', // Cell from table5.html
            ];

            // Iterate over the external HTML files
            urls.forEach((url, index) => {
                fetch(url)
                    .then(response => response.text())  // Fetch the HTML file as text
                    .then(html => {
                        // Parse the HTML content
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, 'text/html');

                        // Select the specific cell using the selector
                        const specificCell = doc.querySelector(selectors[index]);

                        // If the cell is found, set the value in the current table's cell
                        if (specificCell) {
                            const value = specificCell.textContent.trim();  // Get the text of the cell
                            document.getElementById('score' + (index + 1)).textContent = value;  // Update the main table
                        } else {
                            document.getElementById('score' + (index + 1)).textContent = 'Cell not found';
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching data from ' + url, error);
                        document.getElementById('score' + (index + 1)).textContent = 'Error fetching data';
                    });
            });
        }

        // Fetch the data when the page loads
        window.addEventListener('load', fetchDataFromOtherHTML);
    </script>

</body>
